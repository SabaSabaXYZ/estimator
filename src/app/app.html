<nav>
  <mat-toolbar>
    <span>Estimator</span>
    <span class="toolbar-space"></span>
    <a
      matButton
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page">Estimate</a>
    <a
      matButton
      routerLink="/analysis"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page">Analysis</a>
    <span class="toolbar-space"></span>
    <button type="button" matIconButton [cdkCopyToClipboard]="state.fullAnalysis()" [cdkCopyToClipboardAttempts]="5" aria-label="Copy Estimation">
      <mat-icon>content_copy</mat-icon>
    </button>
    <button type="button" matIconButton (click)="state.saveFile()" aria-label="Save Estimation">
      <mat-icon>save_as</mat-icon>
    </button>
    <button type="button" matIconButton (click)="loadFile()" aria-label="Load Estimation">
      <mat-icon>file_open</mat-icon>
    </button>
    <mat-slide-toggle [(ngModel)]="theme.isDark" aria-label="Select theme">
      @if (theme.theme() === 'dark') {
      <mat-icon>bedtime</mat-icon>
      } @else {
      <mat-icon>sunny</mat-icon>
      }
    </mat-slide-toggle>
  </mat-toolbar>
  <mat-progress-bar mode="determinate" [value]="state.analysisPercentage()" aria-label="Analysis progress"></mat-progress-bar>
</nav>
<main>
  <router-outlet></router-outlet>
</main>
