<h1>Analysis</h1>
<h2>Add Question</h2>
<div class="section">
  <span class="item">
    <mat-form-field>
      <mat-label>Question</mat-label>
      <input type="text" matInput [formField]="state.addQuestionForm.question" (keydown.enter)="handleSubmit()">
      <mat-error>{{ state.addQuestionFormErrors().question }}</mat-error>
    </mat-form-field>
  </span>
  <span class="item">
    <mat-form-field>
      <mat-label>Answer</mat-label>
      <input type="text" matInput [formField]="state.addQuestionForm.answer" (keydown.enter)="handleSubmit()">
      <mat-error>{{ state.addQuestionFormErrors().answer }}</mat-error>
    </mat-form-field>
  </span>
</div>
<div class="section">
  <span class="item">
    <button matFab extended (click)="addQuestionAnswer()" class="primary-fab-button">
      <mat-icon>add</mat-icon>
      Add Question &amp; Answer
    </button>
  </span>
  @if (state.addQuestionForm().value().id !== 0) {
  <span class="item">
    <button matFab extended (click)="updateQuestionAnswer()">
      <mat-icon>edit</mat-icon>
      Update Question &amp; Answer
    </button>
  </span>
  }
</div>
<h2>View Questions and Answers</h2>
<div class="section">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>
    <ng-container matColumnDef="question">
      <th mat-header-cell *matHeaderCellDef>Question</th>
      <td mat-cell *matCellDef="let element">{{ element.question }}</td>
    </ng-container>
    <ng-container matColumnDef="answer">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Answer</th>
      <td mat-cell *matCellDef="let element">{{ element.answer }}</td>
    </ng-container>
    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef>Edit</th>
      <td mat-cell *matCellDef="let element">
        <button matIconButton (click)="editQuestionAnswer(element)" aria-label="Edit question">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
      <td mat-footer-cell *matFooterCellDef></td>
    </ng-container>
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Delete</th>
      <td mat-cell *matCellDef="let element">
        <button matIconButton (click)="deleteQuestionAnswer(element)" aria-label="Delete question">
          <mat-icon>delete_forever</mat-icon>
        </button>
      </td>
      <td mat-footer-cell *matFooterCellDef></td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true;"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
